      operations:
      - name: getmanifest
        method: GET
        description: ACR Get manifest
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: putmanifest
        method: PUT
        description: ACR Put manifest
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
