      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: microsoft-azure-container-registry-manifests.putmanifest
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: acr-delete-manifest
