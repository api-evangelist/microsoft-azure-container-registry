      name: v2-name-tags-list
      description: REST surface for v2-name-tags-list.
      operations:
      - method: GET
        name: listtags
        description: ACR List tags
        call: microsoft-azure-container-registry-tags.listtags
        outputParameters:
        - type: object
          mapping: $.
