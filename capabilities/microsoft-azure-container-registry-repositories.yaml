naftiko: 1.0.0-alpha2
info:
  label: Azure Container Registry REST API — Repositories
  description: 'Azure Container Registry REST API — Repositories. 1 operations. Lead operation: ACR List repositories. Self-contained
    Naftiko capability covering one Microsoft Azure Container Registry business surface.'
  tags:
  - Microsoft Azure Container Registry
  - Repositories
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MICROSOFT_AZURE_CONTAINER_REGISTRY_API_KEY: MICROSOFT_AZURE_CONTAINER_REGISTRY_API_KEY
capability:
  consumes:
  - type: http
    namespace: microsoft-azure-container-registry-repositories
    baseUri: https://{registry}.azurecr.io
    description: Azure Container Registry REST API — Repositories business capability. Self-contained, no shared references.
    resources:
    - name: v2-_catalog
      path: /v2/_catalog
      operations:
      - name: listrepositories
        method: GET
        description: ACR List repositories
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.MICROSOFT_AZURE_CONTAINER_REGISTRY_API_KEY}}'
  exposes:
  - type: rest
    namespace: microsoft-azure-container-registry-repositories-rest
    port: 8080
    description: REST adapter for Azure Container Registry REST API — Repositories. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/v2/catalog
      name: v2-catalog
      description: REST surface for v2-_catalog.
      operations:
      - method: GET
        name: listrepositories
        description: ACR List repositories
        call: microsoft-azure-container-registry-repositories.listrepositories
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: microsoft-azure-container-registry-repositories-mcp
    port: 9090
    transport: http
    description: MCP adapter for Azure Container Registry REST API — Repositories. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: acr-list-repositories
      description: ACR List repositories
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: microsoft-azure-container-registry-repositories.listrepositories
      outputParameters:
      - type: object
        mapping: $.
